# build-kit.sh settings for the constellation scene (sourced by scene/build.sh).
here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
KIT_SOURCE="$here/main.cpp"
KIT_OUT="$(dirname "$here")/web"
KIT_NAME=constellation-engine
KIT_EXPORT_NAME=createConstellation
KIT_EXPORTS=_cv_set_places,_cv_set_stars,_cv_set_planets
KIT_WORK="$(dirname "$here")/.strata/work"
